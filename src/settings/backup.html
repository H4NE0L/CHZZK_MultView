<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>설정 백업 · 치지직 통합관제실</title>
  <link rel="stylesheet" href="../shared/group-manager.css">
  <link rel="stylesheet" href="backup.css">
</head>
<body>
  <main class="cg-dialog">
    <header><strong>설정 내보내기 / 불러오기</strong></header>
    <section class="cg-body">
      <p>즐겨찾기·그룹, 마지막 방송 목록·배치·음량, 단축키, 채팅 수집 설정·높이, 녹화 품질을 JSON 파일로 보관합니다.</p>
      <p class="cg-help">로그인 정보·채팅 내용·녹화 파일은 포함하지 않습니다. 불러오면 현재 설정과 목록을 교체하며, 직전 상태를 자동 보관합니다. 열린 멀티뷰는 불러오기 후 새로고침하세요.</p>
      <div class="project-backup-folder"><button id="chooseProject" type="button">프로젝트 폴더 선택</button><p id="projectFolder" role="status">저장할 프로젝트 폴더를 선택해주세요.</p><p class="cg-help">선택한 프로젝트 폴더 안의 .backup에 저장합니다. dist가 아닌 프로젝트 폴더를 선택하세요.</p></div>
      <div id="settingsBackup"></div>
    </section>
  </main>
  <script src="../shared/chzzk-api.js"></script>
  <script src="../shared/favorites-store.js"></script>
  <script src="../shared/session-store.js"></script>
  <script src="../shared/important-chat.js"></script>
  <script src="../shared/favorites-backup.js"></script>
  <script src="../shared/settings-backup.js"></script>
  <script src="../shared/settings-backup-client.js"></script>
  <script src="../shared/favorites-backup-ui.js"></script>
  <script src="backup.js"></script>
</body>
</html>
