<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>녹화 결과 — 치지직 통합관제실</title><link rel="stylesheet" href="recording.css"></head><body>
<header><h1>녹화 결과</h1><button id="close" type="button">닫기</button></header>
<main><video id="preview" controls preload="metadata"></video><p id="warning"></p>
<div class="settings"><label>저장 형식 <select id="format"></select></label><label>시작(초) <input id="start" type="number" min="0" step="0.1" value="0"></label><label>종료(초) <input id="end" type="number" min="0" step="0.1"></label></div>
<p class="help">다른 형식으로 변환하거나 구간을 저장하면 선택 길이만큼 재생하며 처리합니다. 지원하지 않는 형식은 선택할 수 없습니다.</p>
<div><button id="save" type="button" disabled>전체 저장</button><button id="trim" type="button" disabled>선택 구간 저장</button><button id="cancel" type="button" hidden>처리 취소</button><button id="discard" type="button">결과 삭제</button></div><p id="status" role="status">녹화 결과를 불러오는 중…</p></main>
<script src="../shared/recordings-store.js"></script><script src="recording.js"></script></body></html>
